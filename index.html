<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>初中考纲词组 · 闪卡</title>

<!-- ============ PWA / iOS 支持 ============ -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="考纲词组闪卡" />
<meta name="theme-color" content="#7fb0e0" />
<meta name="description" content="初中考纲词组 · 347 个高频词组，英译中 / 中译英双模式翻转闪卡，即点即学。" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<style>
    /* ============ 全局重置 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; touch-action: manipulation; }
    html { min-height: 100%; }
    body {
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        color: #2d2d44;
        transition: background 0.45s ease;
        background-attachment: fixed;
        -webkit-background-attachment: fixed;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
        -webkit-font-smoothing: antialiased;
    }
    /* 首页 & 闪卡页背景：白底蓝色点阵（JS 加载后由 setBg 覆盖，保持一致） */
    body.home, body.passage {
        background-color: #ffffff;
        background-image: radial-gradient(rgba(70, 130, 190, 0.30) 1.6px, transparent 1.6px);
        background-size: 24px 24px;
    }

    /* ============ 通用玻璃面板 ============ */
    .panel {
        width: 100%;
        max-width: 700px;
        margin: auto;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 44px;
        border: 1.5px solid rgba(70, 130, 190, 0.30);
        box-shadow: 0 10px 24px -14px rgba(20, 45, 80, 0.18);
        padding: 34px 28px 40px;
    }

    /* ============ 视图切换 ============ */
    .view { display: none; }
    .view.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100dvh - 32px);
        padding-bottom: 4vh;
        animation: fadeUp .35s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* =========================================================
       首页
       ========================================================= */
    .home-panel { padding: 38px 24px 44px; text-align: center; }
    .home-title {
        font-size: clamp(30px, 7.5vw, 44px);
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #2e5f96 0%, #6ea3d6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.25;
    }
    .home-sub {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 10px;
        font-size: 13.5px; font-weight: 600; letter-spacing: 2px;
        color: rgba(46, 95, 150, 0.55);
        background: rgba(46, 95, 150, 0.05);
        border: 1px solid rgba(46, 95, 150, 0.14);
        padding: 6px 18px; border-radius: 60px;
        backdrop-filter: blur(4px);
    }
    .home-stats {
        margin-top: 18px;
        font-size: 14px; color: rgba(30, 65, 105, 0.72); letter-spacing: 1px;
    }
    .home-stats b { font-weight: 700; color: #2e5f96; }

    /* 分组按钮（双列平面风格，REVIEW 全宽） */
    .grid { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .p-btn {
        position: relative;
        border: 1px solid rgba(63, 123, 184, 0.55);
        border-radius: 18px;
        padding: 16px 18px 15px;
        text-align: center;
        cursor: pointer;
        color: #1d4e80;
        background: #ffffff;
        box-shadow: none;
        transition: background 0.2s ease, transform 0.15s ease;
        text-decoration: none;
        display: block;
    }
    .p-btn:active { transform: scale(0.97); }
    .p-btn .p-no { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
    .p-btn .p-count { display: block; margin-top: 4px; font-size: 12.5px; opacity: 0.9; }
    .p-btn .p-go {
        position: absolute; top: 50%; right: 16px; transform: translateY(-50%);
        width: 26px; height: 26px; border-radius: 50%;
        background: #ffffff;
        border: 1px solid rgba(63, 123, 184, 0.45);
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; line-height: 1;
    }
    /* REVIEW 按钮：品牌浅蓝，全宽 */
    .p-btn-review {
        grid-column: 1 / -1;
        background: #3f7ab8;
        color: #fff;
        border-color: #3f7ab8;
    }
    .p-btn-review .p-go { background: rgba(255, 255, 255, 0.30); }

    /* =========================================================
       闪卡页（主题变量由 JS 注入）
       ========================================================= */
    .back-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 2px; }
    .back-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px;
        border: 1px solid rgba(63, 123, 184, 0.55);
        cursor: pointer;
        background: #ffffff;
        color: #1d4e80;
        font-size: 20px; font-weight: 600;
        padding: 0; border-radius: 50%;
        box-shadow: none;
        transition: transform .15s ease;
    }
    .back-btn:active { transform: scale(0.94); }
    .back-btn .arr { font-size: 18px; line-height: 1; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; gap: 10px; }
    .header h1 {
        font-size: clamp(20px, 5.4vw, 28px);
        font-weight: 700; letter-spacing: 2px;
        color: var(--accent, #35689f);
        background: linear-gradient(135deg, var(--c2, #7fa8d8), var(--c1, #35689f));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header .counter {
        flex-shrink: 0;
        font-size: 15px; font-weight: 600; color: #1d4e80;
        background: #ffffff;
        border: 1px solid rgba(63, 123, 184, 0.45);
        padding: 6px 15px; border-radius: 40px;
        box-shadow: none;
    }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    /* REVIEW 分享导出按钮 */
    .share-btn {
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid rgba(63, 123, 184, 0.55);
        cursor: pointer;
        background: #ffffff;
        color: #1d4e80;
        display: flex; align-items: center; justify-content: center;
        box-shadow: none;
        transition: transform .15s ease, opacity .2s ease;
    }
    .share-btn:active { transform: scale(0.9); }
    .share-btn.disabled { opacity: 0.4; pointer-events: none; }
    .share-btn svg { width: 17px; height: 17px; fill: currentColor; }
    /* GO 按钮：绿底白字，与 GO 复习闪卡绿色主题呼应 */
    .go-btn {
        border: 1px solid #6fae8e;
        cursor: pointer;
        background: #6fae8e;
        color: #ffffff;
        font-size: 15px; font-weight: 600;
        padding: 8px 16px; border-radius: 60px;
        box-shadow: none;
        transition: transform .15s ease, opacity .2s ease;
    }
    .go-btn:active { transform: scale(0.94); }
    .go-btn.disabled { opacity: 0.4; pointer-events: none; }

    /* 英译中 / 中译英 模式切换 */
    .mode-switch {
        display: flex; justify-content: center; gap: 4px;
        margin: 0 auto 16px;
        padding: 4px;
        width: fit-content;
        background: #ffffff;
        border: 1px solid rgba(63, 123, 184, 0.45);
        border-radius: 60px;
    }
    .ms-btn {
        border: none; background: transparent;
        padding: 8px 24px; border-radius: 40px;
        font-size: 14.5px; font-weight: 600;
        color: #1d4e80;
        cursor: pointer;
        transition: all .2s ease;
        letter-spacing: 1px;
    }
    .ms-btn.active {
        background: #3f7ab8;
        color: #fff;
        box-shadow: none;
    }

    .card-wrapper { perspective: 1200px; margin: -8px 0 22px; position: relative; }
    .card {
        position: relative; width: 100%; padding-top: 112%;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        transform-style: preserve-3d;
        cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border-radius: 26px;
        backface-visibility: hidden; -webkit-backface-visibility: hidden;
        display: flex; flex-direction: column;
        padding: 30px 26px;
        background: var(--cardBg, #f5faff);
        box-shadow: 0 8px 18px -10px var(--glow, rgba(47,95,158,0.18));
        border: 1px solid rgba(70, 130, 190, 0.18);
        overflow-y: auto;
        overflow-x: hidden;
    }
    /* 安全垂直居中：内容少时居中；内容超高时顶部对齐可完整滚动 */
    .card-face::before,
    .card-face::after {
        content: '';
        flex: 0 0 auto;
        margin: auto;
    }
    .card-front { align-items: center; text-align: center; }
    .card-front .word {
        font-size: clamp(40px, 10vw, 68px);
        font-weight: 700; color: #1a1a2e; letter-spacing: 1px;
        line-height: 1.25; margin-bottom: 6px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        max-width: 100%;
    }
    .card-front .word.long { font-size: clamp(28px, 7vw, 52px); letter-spacing: 0; }
    .card-front .word.very-long { font-size: clamp(24px, 6.2vw, 48px); letter-spacing: 0; white-space: normal; }
    /* 中译英模式：正面是中文释义，字号适当缩小 */
    .card-front .word.zh {
        font-size: clamp(28px, 6.5vw, 46px);
        line-height: 1.4;
    }
    .card-front .speak-btn {
        margin-top: 8px;
        background: #ffffff;
        border: 1px solid rgba(63, 123, 184, 0.55);
        border-radius: 60px; padding: 10px 26px;
        font-size: 17px; font-weight: 600; color: #1d4e80;
        display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
        transition: transform .18s ease, background .2s ease;
    }
    .card-front .speak-btn:active { transform: scale(0.94); }
    .card-front .speak-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .card-front .flip-hint {
        position: absolute; bottom: 16px; right: 26px;
        color: var(--hint, #7fa8d8); opacity: 0.75;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0;
    }
    .card-front .flip-hint svg { width: 24px; height: 24px; fill: currentColor; }

    /* 收藏 "+" 按钮（卡片右上角，无背景无边框，仅符号） */
    .add-btn {
        position: absolute; top: 14px; right: 14px; z-index: 6;
        width: 42px; height: 42px; border-radius: 50%;
        border: none;
        cursor: pointer;
        background: transparent;
        color: #3f7ab8;
        font-size: 30px; font-weight: 500; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        box-shadow: none;
        transition: transform .18s ease, color .2s ease;
    }
    .add-btn:active { transform: scale(0.9); }
    .add-btn.added {
        background: transparent;
        color: #3f7ab8;
        border: none;
        font-size: 24px;
        font-weight: 700;
    }

    .card-back { transform: rotateY(180deg); align-items: flex-start; text-align: left; gap: 7px; }
    .card-back .back-word { font-size: 16.5px; font-weight: 600; color: #5b7899; margin-bottom: 2px; }
    /* 背面：中文释义放大加粗并居中 */
    .card-back .detail .content#meaningDisplay {
        font-size: clamp(22px, 6.2vw, 30px);
        font-weight: 700;
        color: #1a2a44;
        text-align: center;
        padding: 8px 2px 10px;
        line-height: 1.5;
    }
    .card-back .detail { width: 100%; margin-bottom: 5px; }
    .card-back .detail .label {
        font-size: 12.5px; font-weight: 700; color: var(--accent, #35689f);
        text-transform: uppercase; letter-spacing: 0.8px;
        background: var(--label-bg, rgba(47,95,158,0.08));
        display: inline-block; padding: 2px 10px; border-radius: 8px; margin-bottom: 4px;
    }
    .card-back .detail .content { font-size: 15.5px; line-height: 1.6; color: #2d2d44; padding-left: 2px; }
    .card-back .detail .content .example-en { font-style: normal; color: #2d2d44; font-size: 17px; line-height: 1.7; }
    .card-back .detail .content .example-en .highlight { color: #e8940a; font-weight: 700; font-style: normal; }
    .card-back .detail .content .example-zh { color: #4f6a8c; font-size: 15.5px; line-height: 1.65; }
    /* 背面：同义内容放大加粗 */
    .card-back .detail .content#synonymDisplay {
        font-size: 19px;
        font-weight: 700;
        color: #1a2a44;
        letter-spacing: 0.2px;
    }
    /* ZH（中译英）翻转面：格式调换 —— 英文词组放大加粗居中，中文释义缩小为提示
       注：.card-back 为 flex column + align-items:flex-start，flex 子项宽度收缩为内容宽，
       text-align:center 对收缩宽度元素无效；必须 align-self:stretch 占满宽度才能真正居中 */
    .card-back.zh .back-word {
        align-self: stretch;
        width: 100%;
        font-size: clamp(28px, 7.8vw, 42px);
        font-weight: 700;
        color: #1a2a44;
        text-align: center;
        padding: 8px 2px 10px;
        line-height: 1.5;
    }
    .card-back.zh .detail .content#meaningDisplay {
        font-size: 16.5px;
        font-weight: 600;
        color: #5b7899;
        text-align: left;
        padding: 0 2px 2px;
        line-height: 1.5;
    }
    .card-back .flip-hint-back {
        position: absolute; bottom: 16px; right: 26px;
        color: var(--hint, #7fa8d8); opacity: 0.75;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0;
    }
    .card-back .flip-hint-back svg { width: 24px; height: 24px; fill: currentColor; }

    .nav { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
    /* 上一页/下一页箭头外移，与随机按钮拉开间距防误触 */
    .nav #prevBtn { margin-right: 26px; }
    .nav #nextBtn { margin-left: 26px; }
    .nav button {
        border: 1px solid rgba(63, 123, 184, 0.55);
        width: 48px; height: 48px; border-radius: 50%;
        font-size: 18px; font-weight: 600; cursor: pointer;
        background: #ffffff; color: #1d4e80;
        box-shadow: none;
        display: inline-flex; align-items: center; justify-content: center;
        letter-spacing: 0;
        transition: transform .15s ease, background .2s ease;
    }
    .nav button .btn-icon { font-size: 16px; line-height: 1; }
    .nav button.primary { width: auto; padding: 0 22px; border-radius: 60px; }
    .nav button:active { transform: scale(0.94); }
    .nav button.primary {
        background: #3f7ab8;
        color: #fff; border: 2px solid #3f7ab8;
        box-shadow: none;
    }
    .nav .btn-icon { font-size: 18px; line-height: 1; }

    .card-face::-webkit-scrollbar { width: 4px; }
    .card-face::-webkit-scrollbar-track { background: transparent; }
    .card-face::-webkit-scrollbar-thumb { background: var(--scroll, #a8c6e8); border-radius: 10px; }

    /* =========================================================
       REVIEW 收藏页
       ========================================================= */
    .review-panel { padding: 30px 24px 40px; }
    .review-panel .header h1 {
        background: linear-gradient(135deg, #7fb0e0 0%, #2e5f96 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: #2e5f96;
    }
    .review-panel .header .counter {
        color: #2e5f96;
    }
    .review-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; width: 100%; }
    .r-item {
        display: flex; align-items: center; gap: 12px;
        background: #ffffff;
        border: 1px solid rgba(63, 123, 184, 0.45);
        border-radius: 16px;
        padding: 14px 14px 14px 18px;
        box-shadow: none;
        cursor: pointer;
        transition: transform .15s ease;
    }
    .r-item:active { transform: scale(0.98); }
    .r-info { flex: 1; min-width: 0; }
    .r-word { font-size: 18px; font-weight: 700; color: #1a1a2e; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .r-tag { font-size: 12px; font-weight: 600; color: #fff; background: #4a86c8; border-radius: 20px; padding: 1px 9px; }
    .r-meaning { font-size: 13.5px; color: #4f6a8c; margin-top: 3px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .r-del {
        flex-shrink: 0;
        width: 36px; height: 36px; border-radius: 50%;
        border: none; cursor: pointer;
        background: transparent;
        color: #9aabc0;
        font-size: 26px; font-weight: 400; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        transition: transform .15s ease, color .2s ease;
    }
    .r-del:active { transform: scale(0.88); }
    .review-empty {
        margin-top: 40px; text-align: center;
        color: rgba(46, 95, 150, 0.55);
        font-size: 15px; line-height: 2; letter-spacing: 1px;
    }
    .review-empty .big { font-size: 44px; display: block; margin-bottom: 10px; }

    /* ============ 响应式 ============ */
    @media (max-width: 560px) {
        body { padding: calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px); }
        .panel { border-radius: 32px; padding: 22px 16px 28px; }
        .home-panel { padding: 28px 14px 34px; }
        .grid { gap: 10px; margin-top: 22px; }
        .p-btn { padding: 15px 16px 14px; }
        .card-face { padding: 22px 18px; }
        .card-front .word { font-size: 46px; }
        .card-front .word.zh { font-size: 30px; }
        .card-back .detail .content { font-size: 14px; }
        .nav button { width: 42px; height: 42px; font-size: 16px; }
        .nav button.primary { width: auto; padding: 0 16px; }
        .nav { gap: 8px; }
        .card-front .flip-hint, .card-back .flip-hint-back { bottom: 10px; right: 18px; }
        .card-front .speak-btn { padding: 8px 18px; font-size: 15px; }
        .header { margin-bottom: 12px; }
        .mode-switch { margin-bottom: 12px; }
        .ms-btn { padding: 7px 18px; font-size: 13.5px; }
        .review-panel { padding: 22px 14px 28px; }
        .add-btn { width: 38px; height: 38px; font-size: 23px; top: 12px; right: 12px; }
    }
    @media (max-width: 390px) {
        .panel { border-radius: 26px; padding: 18px 12px 24px; }
        .card-front .word { font-size: 38px; }
        .card-front .word.zh { font-size: 26px; }
        .nav button { width: 38px; height: 38px; font-size: 15px; }
        .nav button.primary { width: auto; padding: 0 14px; }
        .ms-btn { padding: 6px 14px; font-size: 13px; }
    }

    /* =========================================================
       GO 复习闪卡绿色主题覆盖（仅 body.review-go 生效，
       由 openReviewFlash() 注入；DAY 闪卡页不受影响）
       ========================================================= */
    body.review-go .panel { background: #ffffff; border-color: rgba(111, 174, 142, 0.30); }
    body.review-go .app-shell { border-color: rgba(111, 174, 142, 0.30); }
    body.review-go .mode-switch { border-color: rgba(111, 174, 142, 0.45); }
    body.review-go .ms-btn { color: #2e6b4f; }
    body.review-go .ms-btn.active { background: #6fae8e; color: #fff; }
    body.review-go .card-face { border-color: transparent; box-shadow: 0 8px 18px -10px rgba(60, 100, 75, 0.18); }
    body.review-go .card-front .speak-btn { border-color: rgba(111, 174, 142, 0.55); color: #2e6b4f; }
    body.review-go .add-btn { color: #6fae8e; }
    body.review-go .add-btn.added { color: #6fae8e; }
    body.review-go .nav button { border-color: rgba(111, 174, 142, 0.55); color: #2e6b4f; }
    body.review-go .nav button.primary { background: #6fae8e; border-color: #6fae8e; color: #fff; }
    /* GO 闪卡页：右上统计数字 / 左上返回箭头圆框 → 绿色 */
    body.review-go .header .counter { color: #2e6b4f; border-color: rgba(111, 174, 142, 0.45); }
    body.review-go .back-btn { color: #2e6b4f; border-color: rgba(111, 174, 142, 0.55); }
</style>
</head>
<body class="home">

<!-- ================= 首页 ================= -->
<section id="homeView" class="view active">
    <div class="panel home-panel">

    /* 正面词组字号自适应：按 canvas 实测宽度选择档位，避免窄屏省略号截断。
       分档字号必须与 CSS 保持一致：
         默认      clamp(40px,10vw,68px) + letter-spacing:1px
                  （≤560px 断点覆盖为 46px，≤390px 覆盖为 38px）
         long      clamp(28px,7vw,52px)
         very-long clamp(24px,6.2vw,48px) + white-space:normal（单行放不下自动换行，不截断）
       long/very-long 特异性高于断点覆盖，不受其影响。 */
    function pickPhraseClass(text) {
        var vw = window.innerWidth || 375;
        var defSize = vw <= 390 ? 38 : (vw <= 560 ? 46 : Math.min(Math.max(vw * 0.10, 40), 68));
        var cands = [
            { cls: '', size: defSize },
            { cls: 'long', size: Math.min(Math.max(vw * 0.07, 28), 52) },
            { cls: 'very-long', size: Math.min(Math.max(vw * 0.062, 24), 48) }
        ];
        /* 可用宽度 = 面板宽 - panel 侧边距 - 卡片内边距 - 安全余量（与 CSS 断点一致） */
        var bodyPad = vw <= 560 ? 24 : 32;
        var shell = vw > 560 ? Math.min(vw - bodyPad, 700) : vw - bodyPad;
        var panelPad = vw <= 390 ? 24 : (vw <= 560 ? 32 : 56);
        var cardPad = vw <= 560 ? 36 : 52;
        var avail = Math.max(200, shell - panelPad - cardPad - 6);
        var c = document.createElement('canvas');
        var ctx = c.getContext ? c.getContext('2d') : null;
        if (!ctx) { /* 极端环境 canvas 不可用 → 保守字符数兜底（宁小勿截，阈值低于真实所需） */
            var L = text.length;
            return L > 20 ? 'very-long' : (L > 13 ? 'long' : '');
        }
        var font = '700 0px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif';
        for (var i = 0; i < cands.length; i++) {
            ctx.font = font.replace('0px', cands[i].size + 'px');
            var w = ctx.measureText(text).width;
            if (i === 0) w += (text.length - 1) * 1; /* 默认档 letter-spacing: 1px */
            if (w <= avail) return cands[i].cls;
        }
        return 'very-long';
    }

        var total = current.p.words.length;
        if (i < 0) i = total - 1;
        if (i >= total) i = 0;
        current.i = i;
        renderCard();
    }
    function next() { goTo(current.i + 1); }
    function prev() { goTo(current.i - 1); }
    function random() {
        var total = current.p.words.length, n;
        do { n = Math.floor(Math.random() * total); } while (n === current.i && total > 1);
        goTo(n);
    }

    /* ============================================================
       收藏
       ============================================================ */
    function updateAddBtn() {
        var d = current.p.words[current.i];
        var added = isInReview(d.phrase);
        $('addBtn').classList.toggle('added', added);
        $('addBtn').textContent = added ? '✓' : '+';
        $('addBtn').setAttribute('aria-label', added ? '移出收藏' : '收藏词组');
    }
    function toggleReview() {
        var d = current.p.words[current.i];
        if (current.mode === 'review') {
            /* 复习模式中取消收藏 → 直接从复习列表移除 */
            removeWord(d.phrase);
            var entries = loadReview().map(function (ph) { return findEntry(ph); }).filter(Boolean);
            if (entries.length === 0) { location.hash = '#/review'; return; }
            current.p.words = entries.map(function (e) { return e.data; });
            if (current.i >= current.p.words.length) current.i = current.p.words.length - 1;
            renderCard();
        } else {
            if (isInReview(d.phrase)) removeWord(d.phrase);
            else addWord(d.phrase);
            updateAddBtn();
        }
        updateBadges();
    }
    function updateBadges() {
        var n = loadReview().length;
        var el = $('reviewHomeCount');
        if (el) el.textContent = n + ' 词组';
        var c = $('reviewCount');
        if (c) c.textContent = n;
        var g = $('goBtn'), s = $('shareBtn');
        if (g) g.classList.toggle('disabled', n === 0);
        if (s) s.classList.toggle('disabled', n === 0);
    }

    /* 根据词组找到所在分组与组内索引 */
    function findEntry(phrase) {
        for (var gi = 0; gi < groups.length; gi++) {
            for (var ii = 0; ii < groups[gi].cards.length; ii++) {
                if (groups[gi].cards[ii].phrase === phrase) return { gi: gi, ii: ii, data: groups[gi].cards[ii] };
            }
        }
        return null;
    }

    /* ============================================================
       首页
       ============================================================ */
    function renderHome() {
        $('statWords').textContent = CARDS.length;

        var grid = $('dayGrid');
        grid.innerHTML = '';

        var reviewBtn = document.createElement('a');
        reviewBtn.className = 'p-btn p-btn-review';
        reviewBtn.href = '#/review';
        reviewBtn.id = 'reviewHomeBtn';
        reviewBtn.innerHTML =
            '<span class="p-no">REVIEW</span>' +
            '<span class="p-count" id="reviewHomeCount">0 词组</span>' +
            '<span class="p-go">›</span>';
        grid.appendChild(reviewBtn);

        groups.forEach(function (g, idx) {
            var btn = document.createElement('a');
            btn.className = 'p-btn';
            btn.href = '#/p/' + idx;
            btn.innerHTML =
                '<span class="p-no">' + g.name + '</span>' +
                '<span class="p-count">' + g.cards.length + ' 词组</span>' +
                '<span class="p-go">›</span>';
            grid.appendChild(btn);
        });

        updateBadges();
    }

    /* ============================================================
       视图 / 路由
       ============================================================ */
    function showView(name) {
        ['homeView', 'passageView', 'reviewView'].forEach(function (v) {
            $(v).classList.toggle('active', v === name);
        });
        window.scrollTo(0, 0);
    }
    function showHome() {
        stopAudio();
        document.body.className = 'home';
        setBg();
        renderHome();
        showView('homeView');
    }
    function openPassage(gi, idx) {
        var g = groups[gi];
        if (!g) { showHome(); return; }
        stopAudio();
        current.g = gi;
        current.i = typeof idx === 'number' && idx >= 0 ? idx : 0;
        current.mode = 'passage';
        current.p = { name: g.name, words: g.cards };
        document.body.className = 'passage';
        applyTheme(DAY_C1, DAY_C2, DAY_CARD);
        setBg();
        $('passageTitle').textContent = '📘 ' + g.name;
        renderCard();
        showView('passageView');
    }
    /* REVIEW 收藏词闪卡（GO 按钮） */
    function openReviewFlash() {
        var entries = loadReview().map(function (ph) { return findEntry(ph); }).filter(Boolean);
        if (entries.length === 0) return;
        stopAudio();
        current.mode = 'review';
        current.p = { name: 'REVIEW', words: entries.map(function (e) { return e.data; }) };
        current.i = 0;
        document.body.className = 'passage review-go';
        applyTheme(REVIEW_GO_C1, REVIEW_GO_C2, REVIEW_GO_CARD);
        setBg('#82a28f');  /* GO 复习闪卡：柔和绿底 + 白色点阵 */
        $('passageTitle').textContent = '📘 REVIEW';
        renderCard();
        showView('passageView');
    }
    function openReview() {
        stopAudio();
        document.body.className = 'home';
        setBg();
        document.documentElement.style.setProperty('--accent', REVIEW_C1);
        renderReview();
        showView('reviewView');
    }
    function stopAudio() {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
    }
    function route() {
        var m = location.hash.match(/^#\/p\/(\d+)/);
        if (m) openPassage(parseInt(m[1], 10));
        else if (location.hash === '#/review') openReview();
        else if (location.hash === '#/go') openReviewFlash();
        else showHome();
    }

    /* ============================================================
       REVIEW 页
       ============================================================ */
    function renderReview() {
        var list = loadReview();
        var wrap = $('reviewList'), empty = $('reviewEmpty');
        wrap.innerHTML = '';
        if (list.length === 0) {
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
            list.forEach(function (ph) {
                var e = findEntry(ph);
                var item = document.createElement('div');
                item.className = 'r-item';
                if (e) {
                    item.innerHTML =
                        '<div class="r-info">' +
                            '<div class="r-word">' + e.data.phrase +
                                '<span class="r-tag">' + groups[e.gi].name + '</span>' +
                            '</div>' +
                            '<div class="r-meaning">' + e.data.meaning + '</div>' +
                        '</div>';
                    item.addEventListener('click', function () {
                        openPassage(e.gi, e.ii);
                    });
                } else {
                    item.innerHTML = '<div class="r-info"><div class="r-word">' + ph + '</div></div>';
                }
                var del = document.createElement('button');
                del.className = 'r-del';
                del.textContent = '−';
                del.setAttribute('aria-label', '移出收藏');
                del.addEventListener('click', function (ev) {
                    ev.stopPropagation();
                    removeWord(ph);
                    renderReview();
                    updateBadges();
                });
                item.appendChild(del);
                wrap.appendChild(item);
            });
        }
        updateBadges();
    }

    /* ============================================================
       REVIEW 导出
       ============================================================ */
    function buildReviewTxt() {
        var list = loadReview();
        var lines = [];
        lines.push('初中考纲词组 · REVIEW 收藏（共 ' + list.length + ' 个）');
        lines.push('导出时间：' + new Date().toLocaleString('zh-CN'));
        lines.push('----------------------------------------');
        lines.push('');
        list.forEach(function (ph) {
            var e = findEntry(ph);
            if (!e) return;
            lines.push('【' + e.data.phrase + '】');
            lines.push('释义：' + e.data.meaning);
            if (e.data.example) {
                lines.push('例句：' + e.data.example + (e.data.exampleZh ? '  ——  ' + e.data.exampleZh : ''));
            }
            lines.push('');
        });
        return lines.join('\n');
    }
    function exportReview() {
        var list = loadReview();
        if (list.length === 0) {
            try { alert('还没有收藏词组，先在闪卡右上角点「+」收藏吧'); } catch (e) {}
            return;
        }
        var content = '\ufeff' + buildReviewTxt();
        var file = new File([content], 'REVIEW词组_' + list.length + '个.txt', { type: 'text/plain;charset=utf-8' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
                files: [file],
                title: 'REVIEW 收藏词组',
                text: '共 ' + list.length + ' 个中考高频词组'
            }).catch(function () {});
        } else {
            var url = URL.createObjectURL(file);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'REVIEW词组_' + list.length + '个.txt';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 200);
        }
    }

    /* ============================================================
       发音（有道 HTTPS + 系统语音兜底）
       ============================================================ */
    function speakWord(word) {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        try {
            var audio = new Audio('https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(word));
            currentAudio = audio;
            audio.play().catch(function () {
                currentAudio = null;
                fallbackSpeak(word);
            });
        } catch (e) {
            fallbackSpeak(word);
        }
    }
    function fallbackSpeak(word) {
        try {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(word);
                u.lang = 'en-US';
                u.rate = 0.85;
                speechSynthesis.speak(u);
            }
        } catch (e) {}
    }

    /* ============================================================
       模式切换
       ============================================================ */
    function setDir(dir) {
        current.dir = (dir === 'zh2en') ? 'zh2en' : 'en2zh';
        saveJSON(MODE_KEY, current.dir);
        document.querySelectorAll('.ms-btn').forEach(function (b) {
            b.classList.toggle('active', b.dataset.dir === current.dir);
        });
        renderCard();
    }

    /* ============================================================
       事件绑定
       ============================================================ */
    window.addEventListener('hashchange', route);

    $('backBtn').addEventListener('click', function () {
        location.hash = current.mode === 'review' ? '#/review' : '#/';
    });
    $('reviewBackBtn').addEventListener('click', function () { location.hash = '#/'; });
    $('goBtn').addEventListener('click', function () {
        if (loadReview().length === 0) return;
        location.hash = '#/go';
    });
    $('shareBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        exportReview();
    });

    document.querySelectorAll('.ms-btn').forEach(function (b) {
        b.addEventListener('click', function () { setDir(b.dataset.dir); });
    });

    /* 禁止双指/双击缩放 */
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });

    $('addBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        toggleReview();
    });
    $('flashcard').addEventListener('click', function (e) {
        if (e.target.closest && (e.target.closest('#speakBtn') || e.target.closest('#addBtn'))) return;
        this.classList.toggle('flipped');
    });
    $('speakBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        speakWord(current.p.words[current.i].phrase);
    });
    $('prevBtn').addEventListener('click', prev);
    $('nextBtn').addEventListener('click', next);
    $('randomBtn').addEventListener('click', random);

    document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (document.body.className !== 'passage') return;
        if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
        else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); random(); }
        else if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); speakWord(current.p.words[current.i].phrase); }
        else if (e.key === 'Escape') { location.hash = current.mode === 'review' ? '#/review' : '#/'; }
    });

    /* ============================================================
       初始化
       ============================================================ */
    /* 启动：任何一步失败都兜底渲染首页按钮，绝不出现"只有标题" */
    function boot() {
        /* ① 先渲染首页按钮（最高优先级，任何失败不影响按钮出现） */
        try { renderHome(); } catch (e) { console.error('renderHome:', e); }
        /* ② 恢复上次模式（放在首页渲染之后：即使失败也不影响按钮） */
        try {
            var savedDir = loadJSON(MODE_KEY);
            if (savedDir === 'zh2en' || savedDir === 'en2zh') setDir(savedDir);
        } catch (e) { console.error('restore mode:', e); }
        /* ③ 路由 */
        try {
            route();
        } catch (e) {
            console.error('route:', e);
            try {
                document.body.className = 'home';
                setBg();
                renderHome();
                showView('homeView');
            } catch (e2) { console.error('fallback:', e2); }
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }

    /* Service Worker：仅在 HTTPS / localhost 注册，file:// 下静默跳过 */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function (err) {
                console.warn('SW 注册失败:', err);
            });
        });
    }
})();
</script>
</body>
</html>
